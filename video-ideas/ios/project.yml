name: VideoIdeas
options:
  bundleIdPrefix: com.soulexperience
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: SUJ8QGZ99N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VideoIdeas:
    type: application
    platform: iOS
    sources: [VideoIdeas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulexperience.videoideas
        PRODUCT_NAME: Video Ideas
        INFOPLIST_KEY_CFBundleDisplayName: Soul Videos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Soul Videos saves the story pictures it makes for your videos to your Photos."
