<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video Ideas</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a working list on the left, the open idea on the right; on a phone the idea covers the list. */
:root{
  --bg:#f3f2fa; --surface:#ffffff; --sunk:#e9e7f5; --line:#d9d6ea;
  --fg:#1b1838; --muted:#625e85; --accent:#5b3fd6; --on-accent:#ffffff; --gold:#b07a12;
  --good:#1f8a5b; --bad:#c23a4b;
  --h-newton:#0f8a8a; --h-weiss:#c2417a; --h-cannon:#6a45d8; --h-other:#b3741a; --h-series:#b07a12;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100e24; --surface:#1a1736; --sunk:#141230; --line:#2e2a55;
  --fg:#eeecfb; --muted:#a39fc6; --accent:#9d87ff; --on-accent:#120f2b; --gold:#e8b84e;
  --good:#4fd39a; --bad:#ff7d8c;
  --h-newton:#3fd0cf; --h-weiss:#ff86b8; --h-cannon:#b19cff; --h-other:#f0b860; --h-series:#e8b84e;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#100e24; --surface:#1a1736; --sunk:#141230; --line:#2e2a55;
  --fg:#eeecfb; --muted:#a39fc6; --accent:#9d87ff; --on-accent:#120f2b; --gold:#e8b84e;
  --good:#4fd39a; --bad:#ff7d8c;
  --h-newton:#3fd0cf; --h-weiss:#ff86b8; --h-cannon:#b19cff; --h-other:#f0b860; --h-series:#e8b84e;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding-block:14px 80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;gap:12px}
.top .logo{flex:none;width:48px;height:48px;border-radius:11px}
.top h1{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.top .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad)}

.bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px;margin-top:6px}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:3px;flex:none}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;color:var(--muted);font-size:.92rem}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs .n{font-variant-numeric:tabular-nums;font-weight:500;opacity:.75;margin-left:4px}
.bar input[type=search],.bar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-width:0}
.bar input[type=search]{flex:1 1 150px}
.bar select{flex:0 1 190px;max-width:100%}

.layout{display:grid;gap:22px;align-items:start}
.listpane{min-width:0}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 12px 4px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.ghost{opacity:.35}
.handle{touch-action:none;cursor:grab;border:0;background:transparent;color:var(--muted);padding:6px 6px;border-radius:8px;line-height:0}
.handle svg{width:18px;height:18px}
.card .open{all:unset;cursor:pointer;display:block;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:1.06rem;line-height:1.22;margin:2px 0 3px;text-wrap:balance}
.card .desc{margin:0;color:var(--muted);font-size:.9rem;line-height:1.38}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{--h:var(--h-other);font-size:.74rem;font-weight:600;line-height:1.25;padding:3px 9px;border-radius:999px;
  background:color-mix(in oklab,var(--h) 15%,var(--surface));color:color-mix(in oklab,var(--h) 72%,var(--fg))}
.tag.series{--h:var(--h-series);background:transparent;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--h) 55%,var(--surface))}
.a-newton{--h:var(--h-newton)} .a-weiss{--h:var(--h-weiss)} .a-cannon{--h:var(--h-cannon)}
.check{border:1.5px solid var(--line);background:transparent;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.check svg{width:16px;height:16px}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.acts{display:flex;gap:8px;align-items:center}
.heart{border:1.5px solid var(--line);background:transparent;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.heart svg{width:17px;height:17px;fill:none}
.heart.on{border-color:#e0457b;color:#e0457b;background:rgba(224,69,123,.10)}
.heart.on svg{fill:currentColor}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}

.detail{display:none;min-width:0}
.detail.open{display:block;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 60px) max(16px,env(safe-area-inset-left,0px))}
.dhead{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.dbody{display:flex;flex-direction:column;gap:20px;max-width:680px;margin:0 auto}
.ed{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:4px 6px;margin:0 -6px;border-radius:8px;
  field-sizing:content;line-height:inherit}
.ed:hover{background:color-mix(in oklab,var(--accent) 6%,transparent)}
.ed:focus{background:var(--surface);outline:2px solid var(--accent);outline-offset:0}
.ed.title{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em}
.ed.desc{color:var(--muted);font-size:1rem}
.src{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.src .ed{width:auto;flex:1 1 180px;font-size:.88rem;font-weight:600;margin:0}
.src .ed.small{flex:0 1 90px;font-weight:500;color:var(--muted)}
.sec h3{font-family:var(--body);font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;
  display:flex;justify-content:space-between;align-items:center}
.sec h3 button{all:unset;cursor:pointer;color:var(--accent);letter-spacing:0;text-transform:none;font-size:.86rem;font-weight:600}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.items li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:start}
.items .mark{touch-action:none;cursor:grab;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:center;padding-top:4px;user-select:none;-webkit-user-select:none}
.items.points .mark{color:var(--accent)}
.items .ed{margin:0}
.items .x{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:8px;opacity:.6}
.items .x:hover{opacity:1;color:var(--bad)}
.hooks .ed{font-weight:600}
.notes{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:0;min-height:96px}
.notes:focus{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.hint{color:var(--muted);font-size:.84rem;margin:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;
  background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:600;font-size:.9rem;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
#toast button{all:unset;cursor:pointer;text-decoration:underline}

@media (min-width:960px){
  .layout{grid-template-columns:minmax(0,430px) minmax(0,1fr)}
  .detail,.detail.open{display:block;position:sticky;inset:auto;top:74px;z-index:1;max-height:calc(100vh - 90px);overflow:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 24px 28px}
  .dhead .back{display:none}
  .dbody{margin:0}
}
@media (max-width:959px){ html.locked,html.locked body{overflow:hidden} }
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .15s} }

/* Phone: cards run edge to edge, the check sits bottom right, and tap-and-hold anywhere moves a card. */
@media (max-width:959px){
  #list{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));gap:6px}
  .card{display:block;position:relative;border-radius:0;border-inline:0;
    padding:14px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px))}
  .card.sel{box-shadow:none}
  .card .tags{min-height:34px;align-items:center;padding-right:92px;margin-top:10px}
  .card .acts{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:12px}
  .card .acts button{margin:0}
}
@media (hover:none),(pointer:coarse){
  .card .handle{display:none}
  .card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .card.chosen{box-shadow:0 10px 28px rgba(20,14,60,.22);transform:scale(1.015);transition:transform .15s,box-shadow .15s;z-index:2}
}
</style>

    <div class="grow">
      <h1>Video Ideas</h1>
      <p id="sub">Loading your list…</p>
    </div>
    <button class="btn primary" id="add" type="button">New idea</button>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-todo" aria-selected="true">To film<span class="n" id="n-todo"></span></button>
      <button type="button" role="tab" id="tab-posted" aria-selected="false">Posted<span class="n" id="n-posted"></span></button>
    </div>
    <input type="search" id="q" placeholder="Search ideas" aria-label="Search ideas">
    <select id="book" aria-label="Filter by book"><option value="">All books</option></select>
  </div>

  <main class="layout">
    <section class="listpane">
      <ol id="list"></ol>
      <div class="empty" id="empty" hidden></div>
    </section>
    <aside class="detail" id="detail" aria-live="off"></aside>
  </main>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(function(){
"use strict";
var SERIES_LABEL = "What Happens When You Die";
var ideas = new Map();          // id -> idea
var tab = "todo", selected = null, loaded = false, store = null, dragging = false;
var pending = {}, timers = {}, chains = {}, shown = "";
function snap(){ var it = selected && ideas.get(selected); return it ? JSON.stringify(it) : ""; }
var $ = function(id){ return document.getElementById(id); };

function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;   // only ever static icon markup
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  (kids || []).forEach(function(c){ if (c) el.appendChild(c); });
  return el;
}
var ICON_GRIP = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="7" cy="5" r="1.6"/><circle cx="13" cy="5" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="13" cy="10" r="1.6"/><circle cx="7" cy="15" r="1.6"/><circle cx="13" cy="15" r="1.6"/></svg>';
var ICON_HEART = '<svg viewBox="0 0 20 20" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M10 16.6s-6.4-3.9-6.4-8.6A3.6 3.6 0 0 1 10 5.9a3.6 3.6 0 0 1 6.4 2.1c0 4.7-6.4 8.6-6.4 8.6z"/></svg>';
var ICON_CHECK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.6 3.6 7.4-8"/></svg>';

function authorClass(a){
  a = (a || "").toLowerCase();
  if (a.indexOf("newton") >= 0) return "a-newton";
  if (a.indexOf("weiss") >= 0) return "a-weiss";
  if (a.indexOf("cannon") >= 0) return "a-cannon";
  return "";
}
function sorted(){
  return Array.from(ideas.values()).sort(function(a,b){ return (a.order||0) - (b.order||0) || String(a.id).localeCompare(String(b.id)); });
}
function visible(){
  var q = $("q").value.trim().toLowerCase(), book = $("book").value;
  return sorted().filter(function(i){
    if (!!i.posted !== (tab === "posted")) return false;
    if (book && i.book !== book) return false;
    if (!q) return true;
    var hay = [i.title, i.desc, i.book, i.author, i.series, i.notes].concat(i.points || [], i.hooks || []).join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}

/* ---------- storage ---------- */
function localStore(){
  var KEY = "video-ideas-v1", rows = [], cb = null;
  function read(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch(e){} if (cb) cb(rows.slice()); }
  return {
    shared: false,
    subscribe: function(next){
      cb = next;
      var saved = read();
      if (saved) { rows = saved; next(rows.slice()); return; }
      fetch("ideas.json").then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
        .then(function(seed){ rows = Array.isArray(seed) ? seed : []; persist(); });
    },
    create: function(id, data){ rows.push(Object.assign({id:id}, data)); persist(); return Promise.resolve(); },
    update: function(id, patch){ rows = rows.map(function(r){ return r.id === id ? Object.assign({}, r, patch) : r; }); persist(); return Promise.resolve(); },
    remove: function(id){ rows = rows.filter(function(r){ return r.id !== id; }); persist(); return Promise.resolve(); }
  };
}
function dbStore(db){
  var col = db.collection("ideas");
  return {
    shared: true,
    subscribe: function(next, fail){
      col.onSnapshot(function(snap){
        next(snap.docs.map(function(d){ return Object.assign({}, d.data(), {id: d.id}); }));
      }, fail);
    },
    create: function(id, data){ return col.doc(id).set(data); },
    update: function(id, patch){ return col.doc(id).update(patch); },
    remove: function(id){ return col.doc(id).delete(); }
  };
}

function save(id, patch, now){
  var cur = ideas.get(id); if (!cur) return;
  ideas.set(id, Object.assign({}, cur, patch));
  if (id === selected) shown = snap();
  pending[id] = Object.assign(pending[id] || {}, patch);
  clearTimeout(timers[id]);
  if (now) flush(id); else timers[id] = setTimeout(function(){ flush(id); }, 700);
}
function flush(id){
  clearTimeout(timers[id]);
  var patch = pending[id]; if (!patch) return;
  delete pending[id];
  chains[id] = (chains[id] || Promise.resolve()).then(function(){ return store.update(id, patch); })
    .catch(function(){ toast("Couldn't save that change. Check your connection and try again."); });
}
function flushAll(){ Object.keys(pending).forEach(flush); }
document.addEventListener("visibilitychange", function(){ if (document.hidden) flushAll(); });

/* ---------- list ---------- */
function renderList(){
  if (dragging) return;
  var all = sorted(), nTodo = 0, nPosted = 0, books = {};
  all.forEach(function(i){ if (i.posted) nPosted++; else nTodo++; if (i.book) books[i.book] = 1; });
  $("n-todo").textContent = loaded ? nTodo : "";
  $("n-posted").textContent = loaded ? nPosted : "";
  $("sub").textContent = !loaded ? "Loading your list…" :
    all.length + (all.length === 1 ? " idea" : " ideas") + " · " + nPosted + " posted" + (store && !store.shared ? " · saved on this device" : "");

  var sel = $("book"), keep = sel.value, names = Object.keys(books).sort();
  if (sel.options.length !== names.length + 1){
    sel.textContent = "";
    sel.appendChild(h("option", {value:"", text:"All books"}));
    names.forEach(function(b){ sel.appendChild(h("option", {value:b, text:b})); });
    sel.value = books[keep] ? keep : "";
  }

  var list = $("list"), rows = visible();
  list.textContent = "";
  rows.forEach(function(i){
    var li = h("li", {class:"card" + (i.id === selected ? " sel" : ""), "data-id": i.id}, [
      h("button", {class:"handle", type:"button", "aria-label":"Drag to reorder", html: ICON_GRIP}),
      h("button", {class:"open", type:"button", onclick:function(){ openIdea(i.id); }}, [
        h("h2", {text: i.title || "Untitled idea"}),
        h("p", {class:"desc", text: i.desc || ""}),
        h("div", {class:"tags"}, [
          i.book ? h("span", {class:"tag " + authorClass(i.author), text: i.book + (i.author ? " · " + i.author : "")}) : null,
          i.series ? h("span", {class:"tag series", text: i.series}) : null
        ])
      ]),
      h("div", {class:"acts"}, [
        h("button", {class:"heart" + (i.loved ? " on" : ""), type:"button", title: i.loved ? "Remove heart" : "Heart it and move it to the top",
          "aria-label": i.loved ? "Remove heart" : "Heart it and move it to the top", "aria-pressed": i.loved ? "true" : "false", html: ICON_HEART,
          onclick:function(){ setLoved(i.id, !i.loved); }}),
        h("button", {class:"check" + (i.posted ? " on" : ""), type:"button", title: i.posted ? "Move back to To film" : "Mark as posted",
          "aria-label": i.posted ? "Move back to To film" : "Mark as posted", html: ICON_CHECK,
          onclick:function(){ setPosted(i.id, !i.posted); }})
      ])
    ]);
    list.appendChild(li);
  });

  var empty = $("empty");
  empty.hidden = rows.length > 0 || !loaded;
  if (!empty.hidden){
    empty.textContent = "";
    var filtered = $("q").value.trim() || $("book").value;
    if (filtered) empty.appendChild(h("span", {text:"Nothing matches that search."}));
    else if (tab === "posted"){ empty.appendChild(h("b", {text:"Nothing posted yet"})); empty.appendChild(h("span", {text:"Tap the check on an idea once the video is live and it moves here."})); }
    else { empty.appendChild(h("b", {text:"No ideas waiting"})); empty.appendChild(h("span", {text:"Tap New idea to add one, or ask Claude for a fresh batch from your books."})); }
  }
}

function setLoved(id, on, restoreOrder){
  var it = ideas.get(id); if (!it) return;
  var prevOrder = it.order || 0, patch = {loved: on};
  if (on && restoreOrder == null){
    var top = Infinity; ideas.forEach(function(x){ if (x.id !== id) top = Math.min(top, x.order || 0); });
    patch.order = (top === Infinity ? 0 : top) - 1;
  }
  if (restoreOrder != null) patch.order = restoreOrder;
  save(id, patch, true);
  renderList(); if (selected === id) renderDetail();
  if (restoreOrder != null) return;
  if (on){ window.scrollTo({top:0, behavior:"smooth"}); toast("Hearted and moved to the top", function(){ setLoved(id, false, prevOrder); }); }
  else toast("Heart removed");
}

function setPosted(id, on){
  var it = ideas.get(id); if (!it) return;
  save(id, {posted: on, postedAt: on ? new Date().toISOString() : null}, true);
  renderList(); if (selected === id) renderDetail();
  toast(on ? "Moved to Posted" : "Moved back to To film", function(){ setPosted(id, !on); });
}

// Touch screens: press and hold anywhere on a card to move it. Mouse: drag the dotted handle.
var TOUCH = window.matchMedia && matchMedia("(hover:none),(pointer:coarse)").matches;
if (window.Sortable) Sortable.create($("list"), Object.assign(TOUCH ? {
    delay: 300, delayOnTouchOnly: true, touchStartThreshold: 6, filter: ".check,.heart", preventOnFilter: false
  } : { handle: ".handle" }, {
  animation: 150, ghostClass: "ghost", chosenClass: "chosen",
  onStart: function(){ dragging = true; },
  onEnd: function(ev){
    dragging = false;
    var el = ev.item, id = el.getAttribute("data-id");
    var prev = el.previousElementSibling && ideas.get(el.previousElementSibling.getAttribute("data-id"));
    var next = el.nextElementSibling && ideas.get(el.nextElementSibling.getAttribute("data-id"));
    var order = prev && next ? ((prev.order||0) + (next.order||0)) / 2 : prev ? (prev.order||0) + 1 : next ? (next.order||0) - 1 : 0;
    if (ev.oldIndex !== ev.newIndex) save(id, {order: order}, true);
    renderList();
  }
}));

/* ---------- detail ---------- */
function grow(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function field(it, name, cls, label, placeholder){
  return h("textarea", {class:"ed " + cls, rows:"1", id:"f-" + name, "aria-label":label, placeholder:placeholder, value: it[name] || "",
    oninput:function(e){ grow(e.target); save(it.id, patchOf(name, e.target.value)); if (name === "title" || name === "desc" || name === "book" || name === "author") softList(); },
    onblur:function(){ flush(it.id); renderList(); },
    onkeydown:function(e){ if (e.key === "Enter" && name !== "notes"){ e.preventDefault(); e.target.blur(); } }});
}
function patchOf(k, v){ var p = {}; p[k] = v; return p; }
var softTimer; function softList(){ clearTimeout(softTimer); softTimer = setTimeout(renderList, 250); }

function listEditor(it, name, numbered){
  var ul = h("ul", {class:"items " + name});
  function values(){ return Array.prototype.map.call(ul.querySelectorAll("textarea"), function(t){ return t.value; }); }
  function commit(now){ save(it.id, patchOf(name, values()), now); }
  function renumber(){ if (numbered) Array.prototype.forEach.call(ul.children, function(li, n){ li.firstChild.textContent = n + 1; }); }
  function row(text){
    var ta = h("textarea", {class:"ed", rows:"1", "aria-label": numbered ? "Hook" : "Point", placeholder: numbered ? "Write a hook" : "Write a point", value: text});
    var li = h("li", null, [
      h("span", {class:"mark", title:"Drag to reorder", text: numbered ? "" : "•"}),
      ta,
      h("button", {class:"x", type:"button", "aria-label":"Remove", text:"✕", onclick:function(){ li.remove(); renumber(); commit(true); }})
    ]);
    ta.addEventListener("input", function(){ grow(ta); commit(false); });
    ta.addEventListener("blur", function(){ flush(it.id); });
    ta.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); var n = row(""); li.after(n); renumber(); commit(false); n.querySelector("textarea").focus(); }
      else if (e.key === "Backspace" && ta.value === "" && ul.children.length > 1){
        e.preventDefault(); var p = li.previousElementSibling || li.nextElementSibling; li.remove(); renumber(); commit(false);
        var t = p.querySelector("textarea"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
      }
    });
    return li;
  }
  (it[name] && it[name].length ? it[name] : [""]).forEach(function(v){ ul.appendChild(row(v)); });
  renumber();
  if (window.Sortable) Sortable.create(ul, {handle:".mark", animation:150, ghostClass:"ghost", onEnd:function(){ renumber(); commit(true); }});
  ul.addRow = function(){ var n = row(""); ul.appendChild(n); renumber(); n.querySelector("textarea").focus(); };
  return ul;
}

function renderDetail(){
  var box = $("detail"), it = selected && ideas.get(selected);
  shown = snap();
  box.textContent = "";
  if (!it){
    box.classList.remove("open"); document.documentElement.classList.remove("locked");
    box.appendChild(h("div", {class:"empty"}, [h("b", {text:"Pick an idea"}), h("span", {text:"Its hooks, talking points and notes open here. Tap any text to edit it."})]));
    return;
  }
  box.classList.add("open"); document.documentElement.classList.add("locked");
  var hooks = listEditor(it, "hooks", true), points = listEditor(it, "points", false);
  var del = h("button", {class:"btn quiet danger", type:"button", text:"Delete idea"});
  del.addEventListener("click", function(){
    if (del.dataset.armed){ var id = it.id; ideas.delete(id); selected = null; store.remove(id).catch(function(){ toast("Couldn't delete it. Try again."); }); renderList(); renderDetail(); toast("Idea deleted"); }
    else { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; setTimeout(function(){ delete del.dataset.armed; del.textContent = "Delete idea"; }, 3500); }
  });
  var body = h("div", {class:"dbody"}, [
    h("div", null, [
      field(it, "title", "title", "Title", "Video title"),
      field(it, "desc", "desc", "Short description", "One line on the story or fact")
    ]),
    h("div", {class:"src"}, [
      h("span", {class:"tag " + authorClass(it.author), text:"Source"}),
      field(it, "book", "", "Book", "Book"),
      field(it, "author", "", "Author", "Author"),
      field(it, "loc", "small", "Page or chapter", "Page"),
      it.series ? h("span", {class:"tag series", text: it.series}) : null
    ]),
    h("section", {class:"sec"}, [
      h("h3", null, [h("span", {text:"Hooks"}), h("button", {type:"button", text:"Add hook", onclick:function(){ hooks.addRow(); }})]),
      hooks
    ]),
    h("section", {class:"sec"}, [
      h("h3", null, [h("span", {text:"Points to cover"}), h("button", {type:"button", text:"Add point", onclick:function(){ points.addRow(); }})]),
      points
    ]),
    h("section", {class:"sec"}, [
      h("h3", null, [h("span", {text:"Notes"})]),
      field(it, "notes", "notes", "Notes", "Filming notes, b-roll, caption ideas, links…")
    ]),
    h("div", {class:"actions"}, [
      h("button", {class:"btn primary", type:"button", text: it.posted ? "Move back to To film" : "Mark as posted", onclick:function(){ setPosted(it.id, !it.posted); }}),
      h("button", {class:"btn", type:"button", text:"Copy outline", onclick:function(){ copyOutline(it.id); }}),
      del
    ]),
    h("p", {class:"hint", text:"Tap any text to edit. Press Enter in a hook or point to add the next one. Drag the number or dot to reorder."})
  ]);
  box.appendChild(h("div", {class:"dhead"}, [
    h("button", {class:"btn back", type:"button", text:"‹ All ideas", onclick:closeIdea}),
    h("span", {class:"hint", text: it.posted ? "Posted" : ""})
  ]));
  box.appendChild(body);
  Array.prototype.forEach.call(box.querySelectorAll("textarea"), grow);
  box.scrollTop = 0;
}
function openIdea(id){ flushAll(); selected = id; renderList(); renderDetail(); }
function closeIdea(){ flushAll(); selected = null; renderList(); renderDetail(); }

function copyOutline(id){
  var it = ideas.get(id); if (!it) return;
  var text = [it.title, it.desc, "", "HOOKS"].concat((it.hooks||[]).map(function(x,n){ return (n+1) + ". " + x; }), ["", "POINTS"],
    (it.points||[]).map(function(x){ return "• " + x; }), it.notes ? ["", "NOTES", it.notes] : [], ["", "Source: " + [it.book, it.author, it.loc].filter(Boolean).join(", ")]).join("\n");
  var ok = function(){ toast("Outline copied"); }, no = function(){ toast("Copy isn't available here. Select the text instead."); };
  try { navigator.clipboard.writeText(text).then(ok, no); } catch(e){ no(); }
}

/* ---------- toast ---------- */
var toastTimer;
function toast(msg, undo){
  var t = $("toast"); t.textContent = ""; t.appendChild(h("span", {text: msg}));
  if (undo) t.appendChild(h("button", {type:"button", text:"Undo", onclick:function(){ t.hidden = true; undo(); }}));
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 4200);
}

/* ---------- controls ---------- */
function setTab(name){
  tab = name;
  $("tab-todo").setAttribute("aria-selected", name === "todo");
  $("tab-posted").setAttribute("aria-selected", name === "posted");
  renderList();
}
$("tab-todo").addEventListener("click", function(){ setTab("todo"); });
$("tab-posted").addEventListener("click", function(){ setTab("posted"); });
$("q").addEventListener("input", renderList);
$("book").addEventListener("change", renderList);
$("add").addEventListener("click", function(){
  if (!store) return;
  var id = "idea-" + Date.now().toString(36), first = sorted()[0];
  var data = {title:"", desc:"", book:"", author:"", loc:"", series:"", points:[""], hooks:["","","","",""], notes:"", posted:false,
    order: first ? (first.order||0) - 1 : 0, createdAt: new Date().toISOString(), factKey:""};
  ideas.set(id, Object.assign({id:id}, data));
  chains[id] = store.create(id, data).catch(function(){ toast("Couldn't add the idea. Try again."); });
  setTab("todo"); openIdea(id);
  var t = $("f-title"); if (t) t.focus();
});

/* ---------- boot ---------- */
function onRows(rows){
  loaded = true;
  var next = new Map();
  rows.forEach(function(r){ next.set(r.id, pending[r.id] ? Object.assign({}, r, pending[r.id]) : r); });
  ideas = next;
  if (selected && !ideas.has(selected)) selected = null;
  renderList();
  var box = $("detail"), busy = box.contains(document.activeElement) && document.activeElement !== document.body;
  if (!busy && !Object.keys(pending).length && !dragging && snap() !== shown) {
    var top = box.scrollTop; renderDetail(); box.scrollTop = top;
  }
}
function start(s){
  store = s;
  var slow = setTimeout(function(){ if (!loaded) $("sub").textContent = "Still loading. If this stays, reopen the page."; }, 10000);
  store.subscribe(function(rows){ clearTimeout(slow); onRows(rows); }, function(){
    clearTimeout(slow); $("sub").textContent = "Couldn't load the list. Reopen the page to try again.";
  });
}
renderList(); renderDetail();
/* ---------- hosted storage (no Claude sign-in) ---------- */
function apiStore(key){
  var CACHE = "video-ideas-cache-v1", chain = Promise.resolve(), inflight = 0, lastWrite = 0, cb = null, failCb = null, timer = null;
  function cache(rows){ try { localStorage.setItem(CACHE, JSON.stringify(rows)); } catch(e){} }
  function pull(){
    if (!cb) return;
    var began = Date.now();
    fetch("/api/ideas", {headers:{"x-key":key}, cache:"no-store"}).then(function(r){
      if (r.status === 401) throw new Error("locked");
      if (!r.ok) throw new Error("load");
      return r.json();
    }).then(function(rows){
      if (inflight || began < lastWrite) return; // a newer change of ours is still on its way
      cache(rows); cb(rows);
    }).catch(function(e){ if (!loaded && failCb) failCb(e); });
  }
  function send(op, id, data){
    inflight++;
    var p = chain.then(function(){
      return fetch("/api/ideas", {method:"POST", headers:{"x-key":key, "Content-Type":"application/json"},
        body: JSON.stringify({op:op, id:id, data:data || {}})}).then(function(r){ if (!r.ok) throw new Error("save"); });
    });
    chain = p.catch(function(){});
    return p.then(function(){ inflight--; lastWrite = Date.now(); cache(Array.from(ideas.values())); },
                  function(e){ inflight--; lastWrite = Date.now(); throw e; });
  }
  function tick(){ clearInterval(timer); if (!document.hidden) timer = setInterval(pull, 20000); }
  document.addEventListener("visibilitychange", function(){ tick(); if (!document.hidden) pull(); });
  window.addEventListener("focus", pull);
  return {
    shared: true,
    subscribe: function(next, fail){
      cb = next; failCb = fail;
      try { var saved = JSON.parse(localStorage.getItem(CACHE) || "null"); if (Array.isArray(saved) && saved.length) next(saved); } catch(e){}
      pull(); tick();
    },
    create: function(id, data){ return send("create", id, data); },
    update: function(id, patch){ return send("update", id, patch); },
    remove: function(id){ return send("remove", id); }
  };
}
function readKey(){
  var m = /[#&]k=([A-Za-z0-9_-]{20,})/.exec(location.hash), key = null;
  try { if (m) localStorage.setItem("video-ideas-key", m[1]); key = m ? m[1] : localStorage.getItem("video-ideas-key"); } catch(e){ key = m && m[1]; }
  if (m && history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  return key;
}
var KEY = readKey();
if (KEY) start(apiStore(KEY));
else $("sub").textContent = "This list is private. Open it from your private link.";
})();
</script>
